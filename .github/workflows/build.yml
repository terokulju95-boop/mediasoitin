# Rakentaa Windows-soittimen ja Android-kaukosäätimen.
# - Jokainen push: valmiit paketit löytyvät Actions-välilehdeltä (Artifacts).
# - Kun versionumero kasvaa tiedostossa soitin/__init__.py, molemmat julkaistaan
#   automaattisesti Releases-sivulle. Soitin ja sovellus päivittävät itsensä sieltä.
#
# Turvallisuus:
# - Riippuvuudet on lukittu: requirements-lock.txt (versiot + tarkistussummat) ja tools/libmpv.lock.
# - Rakennustyöt saavat vain lukuoikeuden repoon. Kirjoitusoikeus on vain julkaisutyöllä.
# - Androidin allekirjoitusavain tulee GitHubin salaisuuksista (Settings → Secrets and variables → Actions):
#     ANDROID_KEYSTORE_BASE64    avaintiedosto base64-muodossa
#     ANDROID_KEYSTORE_PASSWORD  avaimen salasana
name: Rakenna Mediasoitin

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows-soitin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asenna lukitut riippuvuudet
        run: pip install --require-hashes --no-deps -r requirements-lock.txt

      - name: Lataa libmpv (toistomoottori)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/hae_libmpv.ps1

      - name: Rakenna Mediasoitin.exe
        run: >
          pyinstaller --noconfirm --windowed --name Mediasoitin
          --icon soitin/assets/mediasoitin.ico
          --add-data "soitin/assets;soitin/assets"
          --add-data "soitin/shaders;soitin/shaders"
          --add-binary "libmpv-2.dll;."
          mediasoitin.py

      - name: Pakkaa
        shell: pwsh
        run: Compress-Archive -Path dist/Mediasoitin/* -DestinationPath Mediasoitin-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mediasoitin-windows-x64
          path: Mediasoitin-windows-x64.zip

  android:
    name: Android-kaukosäädin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK on valmiiksi asennettuna GitHubin Linux-koneissa (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Allekirjoitusavain salaisuuksista
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Allekirjoitusavain puuttuu. Lisää GitHubiin salaisuudet ANDROID_KEYSTORE_BASE64 ja ANDROID_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kaukosaadin.p12"

      - name: Rakenna APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/kaukosaadin.p12"
          gradle -p android assembleRelease --no-daemon --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk Mediasoitin-kaukosaadin.apk

      - name: Poista avaintiedosto
        if: always()
        run: rm -f "$RUNNER_TEMP/kaukosaadin.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: Mediasoitin-kaukosaadin
          path: Mediasoitin-kaukosaadin.apk

  release:
    name: Julkaise uusi versio
    needs: [windows, android]
    # Julkaistaan, vaikka Android-rakennus epäonnistuisi (soitin julkaistaan silti).
    if: always() && needs.windows.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Luo julkaisu, jos versio on uusi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' soitin/__init__.py)
          if gh release view "v$v" >/dev/null 2>&1; then
            # Versio on jo julkaistu: lisätään Android-sovellus, jos se puuttuu tai on korjattu.
            if [ -f dist/Mediasoitin-kaukosaadin.apk ]; then
              gh release upload "v$v" dist/Mediasoitin-kaukosaadin.apk --clobber
              echo "Android-sovellus lisätty julkaisuun v$v."
            else
              echo "Versio v$v on jo julkaistu - ei muutoksia."
            fi
            exit 0
          fi
          files="dist/Mediasoitin-windows-x64.zip"
          [ -f dist/Mediasoitin-kaukosaadin.apk ] && files="$files dist/Mediasoitin-kaukosaadin.apk"
          gh release create "v$v" $files --title "Mediasoitin $v" --notes "$(git log -1 --pretty=%B)"
