name: Rakenna Windows-versio

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asenna riippuvuudet
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Lataa libmpv (toistomoottori)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/hae_libmpv.ps1

      - name: Rakenna Mediasoitin.exe
        run: >
          pyinstaller --noconfirm --windowed --name Mediasoitin
          --icon soitin/assets/mediasoitin.ico
          --add-data "soitin/assets;soitin/assets"
          --add-binary "libmpv-2.dll;."
          mediasoitin.py

      - name: Pakkaa
        shell: pwsh
        run: Compress-Archive -Path dist/Mediasoitin/* -DestinationPath Mediasoitin-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mediasoitin-windows-x64
          path: Mediasoitin-windows-x64.zip

      - name: Julkaise Releases-sivulle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Mediasoitin-windows-x64.zip
